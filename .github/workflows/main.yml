name: Deploy to Azure Container Registry

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to the main branch

env:
  REGISTRY_NAME: fllregistry
  IMAGE_NAME: fllcalendar                 # Replace with your desired repository/image name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Log in to Azure Container Registry using GitHub Secrets
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 3. Extract metadata and prepare multiple tags (Commit SHA + Latest)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # 4. Set up Docker Buildx (required for advanced caching and building)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build the image and push all configured tags to ACR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}



