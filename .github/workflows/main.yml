name: Deploy to Azure Container Registry

on:
  push:
    branches:
      - main  # Triggers the workflow when code is pushed to the main branch

permissions:
  contents: write   # Needed so the workflow can commit the version bump and push a tag

env:
  REGISTRY_NAME: fllregistry
  IMAGE_NAME: fllcalendar                 # Replace with your desired repository/image name

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip the run this workflow itself creates when it pushes the version bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set the build date
      - name: Set Build Date
        id: date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      # 2b. Bump the patch version (1.0.0, 1.0.1, ...) and push it back to main
      - name: Bump version
        id: version
        run: |
          npm version patch --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${{ env.VERSION }} [skip ci]"
          git tag "v${{ env.VERSION }}"
          git push origin HEAD:main
          git push origin "v${{ env.VERSION }}"

      # 3. Log in to Azure Container Registry using GitHub Secrets
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 3. Extract metadata and prepare multiple tags (Commit SHA + Latest)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}
          tags: |
            #type=sha,format=long
            type=raw,value=latest
            type=raw,value=v${{ env.VERSION }}

      # 4. Set up Docker Buildx (required for advanced caching and building)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build the image and push all configured tags to ACR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            # The original build date argument is commented out
            # BUILD_DATE=${{ env.BUILD_DATE }}
            # Use APP_BUILD_DATE instead
            APP_BUILD_DATE=${{ env.BUILD_DATE }}